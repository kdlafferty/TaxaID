name: R-CMD-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package:
          - TaxaTools
          - TaxaFetch
          - TaxaHabitat
          - TaxaMatch
          - TaxaLikely
          - TaxaExpect
          - TaxaAssign
          - TaxaFlag
          - TaxaWizard
          # The repository root is also an R package: the TaxaID meta-package,
          # whose only job is to install the nine. Nothing checked it until
          # now, which is how an inst/README.md reading "ADD SOFTWARE TITLE
          # (TEMPLATE)" shipped inside it unnoticed. Its own .Rbuildignore
          # scopes the build to the package, so the monorepo around it is not
          # tarballed. This job is also the ONLY one with all nine installed,
          # which is what lets the prompt-pack check below run at all.
          - "."

    name: Check ${{ matrix.package == '.' && 'TaxaID (meta-package)' || matrix.package }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: "yes"   # quoted: R tests for the literal string "yes", and bare yes is a YAML 1.1 boolean
      RENV_CONFIG_AUTOLOADER_ENABLED: "false"
      NOT_CRAN: "true"
      _R_CHECK_FORCE_SUGGESTS_: "false"
      TAXAID_SKIP_LIVE: "1"
      # The blocking check below fails on any WARNING, so it must only see
      # checks whose result depends on this code. These two do not:
      #
      # _R_CHECK_CRAN_INCOMING_  "checking CRAN incoming feasibility" reports
      #   "Strong dependencies not in mainstream repositories: TaxaTools" as a
      #   WARNING for all eight packages that depend on TaxaTools. That is
      #   permanent and correct -- TaxaID releases through USGS GitLab, not
      #   CRAN -- so it can never be fixed and must not gate the build. The
      #   undeclared-import check that caught TaxaFlag's missing cli is
      #   "checking dependencies in R code", a standard check, and is NOT
      #   disabled by this. URL checking IS part of CRAN incoming, so it moves
      #   to its own non-blocking step below.
      # _R_CHECK_SYSTEM_CLOCK_   "checking for future file timestamps" calls
      #   worldclockapi.com and reports "unable to verify current time" when it
      #   cannot. A NOTE either way, so it would not fail the build, but it is
      #   an outbound call on every job and its result is not about this code.
      _R_CHECK_CRAN_INCOMING_: "false"
      _R_CHECK_SYSTEM_CLOCK_: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Disable renv
        run: rm -f renv/activate.R .Rprofile

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev libharfbuzz-dev \
            libfribidi-dev libglpk-dev pandoc

      - name: Install all dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "rcmdcheck"))

          # Canonical dependency chain (topological order)
          chain <- c("TaxaTools", "TaxaFetch", "TaxaHabitat", "TaxaMatch",
                     "TaxaLikely", "TaxaExpect", "TaxaAssign", "TaxaFlag",
                     "TaxaWizard")
          target <- "${{ matrix.package }}"

          # Helper: get local TaxaID deps from a DESCRIPTION file
          get_local_deps <- function(pkg) {
            desc <- read.dcf(file.path(pkg, "DESCRIPTION"))
            fields <- intersect(colnames(desc), c("Imports", "Depends", "Suggests"))
            if (length(fields) == 0L) return(character(0))
            all_deps_str <- paste(desc[, fields], collapse = ",")
            dep_names <- trimws(gsub("\\(.*?\\)", "", unlist(strsplit(all_deps_str, "[,\n]+"))))
            chain[chain %in% dep_names]
          }

          # Recursively collect all local deps (transitive closure)
          collect_all <- function(pkg, visited = character(0)) {
            direct <- get_local_deps(pkg)
            new_deps <- setdiff(direct, visited)
            visited <- union(visited, new_deps)
            for (d in new_deps) {
              visited <- collect_all(d, visited)
            }
            visited
          }

          all_needed <- collect_all(target)
          # Sort by position in the canonical chain (topological order)
          to_install <- chain[chain %in% all_needed]
          message("Local deps to install for ", target, ": ",
                  paste(to_install, collapse = " -> "))

          # Install each local dep and its CRAN dependencies
          for (pkg in to_install) {
            message("Installing CRAN deps for: ", pkg)
            remotes::install_deps(pkg, dependencies = TRUE, upgrade = "never")
            message("Installing local package: ", pkg)
            install.packages(pkg, repos = NULL, type = "source")
          }

          # Install the target package's own CRAN deps
          message("Installing CRAN deps for target: ", target)
          remotes::install_deps(target, dependencies = TRUE, upgrade = "never")

          # rnaturalearthhires is a Suggests of TaxaHabitat but is NOT on CRAN
          # (too large), so remotes::install_deps() above cannot get it and
          # fails silently. The tests that reach flag_habitat_inconsistencies()
          # then skip -- and the coastline logic, which has produced real bugs
          # before, would never be exercised in CI. Install it from the same
          # repo the package's own error message tells users to use.
          # Non-fatal: if r-universe is unreachable the tests skip rather than
          # the build failing on someone else's infrastructure.
          if (!requireNamespace("rnaturalearthhires", quietly = TRUE)) {
            try(install.packages("rnaturalearthhires",
                                 repos = "https://ropensci.r-universe.dev"))
          }
          message("rnaturalearthhires available: ",
                  requireNamespace("rnaturalearthhires", quietly = TRUE))

          # Biostrings (and rBLAST, which needs it) are Suggests of TaxaMatch
          # but live on BIOCONDUCTOR, not CRAN, so remotes::install_deps()
          # above cannot get them. Until this step existed, CI installed
          # nothing from Bioconductor at all: trim_query_to_amplicon.R
          # stop()s without Biostrings, and TaxaMatch's check went to
          # 1 ERROR for 52 consecutive runs on main. The five tests that hit
          # that path now carry skip_if_not_installed("Biostrings") too, so
          # this step restores COVERAGE rather than being load-bearing.
          # Non-fatal, same reasoning as rnaturalearthhires above: if
          # Bioconductor is unreachable the tests skip rather than the build
          # failing on someone else's infrastructure.
          if (!requireNamespace("Biostrings", quietly = TRUE)) {
            try({
              if (!requireNamespace("BiocManager", quietly = TRUE))
                install.packages("BiocManager")
              BiocManager::install("Biostrings", ask = FALSE, update = FALSE)
            })
          }
          message("Biostrings available: ",
                  requireNamespace("Biostrings", quietly = TRUE))

      - name: Check package
        shell: Rscript {0}
        run: |
          # error_on = "warning", not "error". An undeclared cli:: import sat on
          # main for a day because R CMD check reported it as a WARNING and a
          # warning did not fail the build. Every package is at zero warnings
          # under the pinned env above, so this is enforceable today; it gets
          # more expensive to adopt the longer it waits.
          rcmdcheck::rcmdcheck(
            path = "${{ matrix.package }}",
            args = c("--no-manual", "--as-cran"),
            build_args = "--no-manual",
            error_on = "warning"
          )

      # The generated-artefact guards, and why they need their own step.
      # Each of these test files compares a COMMITTED artefact against the
      # source it is generated from: test-pack.R covers llm_prompts/ and the
      # root README's Software Inventory, test-workflow-template.R covers
      # inst/TaxaID_Workflow_Template.R against the snippets it is built from.
      # All of them need a real repository checkout with all nine packages
      # installed. Under R CMD
      # check the package is copied out of the repository, so
      # .pack_find_repo_root() finds no checkout and BOTH ASSERTIONS SKIP --
      # CI was green 9/9 on a tree where both were failing. Run here, in the
      # meta-package job, because it is the only job that installs all nine.
      # A SKIP is treated as a failure: a silent skip is the exact failure
      # this step exists to close.
      - name: Check the generated artefacts (cannot skip)
        if: matrix.package == '.'
        shell: Rscript {0}
        run: |
          install.packages("testthat")
          library(TaxaWizard)
          Sys.setenv(TAXAID_ROOT = getwd())
          # Every test file here guards a COMMITTED artefact against the
          # source it is generated from, and every one of them resolves the
          # repository through .pack_find_repo_root(). Add a file to this
          # vector whenever a new generated artefact gets a guard.
          files <- c(
            "TaxaWizard/tests/testthat/test-pack.R",             # llm_prompts/ + README inventory
            "TaxaWizard/tests/testthat/test-workflow-template.R" # inst/TaxaID_Workflow_Template.R
          )
          bad <- character(0)
          for (f in files) {
            res <- as.data.frame(testthat::test_file(f, reporter = "silent"))
            n_pass <- sum(res$passed); n_fail <- sum(res$failed)
            n_err <- sum(res$error);  n_skip <- sum(res$skipped)
            message(sprintf("%s: %d passed, %d failed, %d errors, %d skipped",
                            basename(f), n_pass, n_fail, n_err, n_skip))
            if (n_fail > 0L || n_err > 0L) {
              bad <- c(bad, sprintf("%s: %d failure(s), %d error(s)",
                                    basename(f), n_fail, n_err))
            }
            # A SKIP is a failure. These guards skip silently under R CMD
            # check, which is how two of them stayed red while CI was green.
            if (n_skip > 0L) {
              bad <- c(bad, sprintf(paste0("%s: %d skipped -- the guard did not run. All nine ",
                                           "packages must be installed and the repository ",
                                           "checkout reachable."), basename(f), n_skip))
            }
            if (n_pass == 0L) {
              bad <- c(bad, sprintf("%s: no passing assertions; the file did not run", basename(f)))
            }
          }
          if (length(bad)) stop(paste(bad, collapse = "\n"))

      # Non-blocking. URL validation is worth keeping -- it is what found the
      # stale console.anthropic.com links -- but it depends on remote servers
      # being reachable and on redirects nobody here controls, so it reports
      # instead of gating. Check the log when it is red.
      - name: Check URLs (advisory)
        if: always()
        continue-on-error: true
        shell: Rscript {0}
        run: |
          if (!requireNamespace("urlchecker", quietly = TRUE))
            install.packages("urlchecker")
          res <- urlchecker::url_check("${{ matrix.package }}")
          print(res)
          if (NROW(res) > 0) message("NOTE: ", NROW(res), " URL(s) need attention.")
